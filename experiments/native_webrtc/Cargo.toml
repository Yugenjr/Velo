[package]
name = "native_webrtc"
version = "0.1.0"
edition = "2024"

[dependencies]
webrtc = "0.12.0"
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
anyhow = "1.0"
rtp = "0.13.0"
bytes = "1.0"
