[package]
name = "velo_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "_velo_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
tokio = { version = "1.0", features = ["full"] }
webrtc = "0.11.0"
rtp = "0.11.0"
crossbeam-channel = "0.5"
bytes = "1.0"
opus = "0.3"

