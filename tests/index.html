<!DOCTYPE html>
<html>
<head>
    <title>Velo V0.2-B Native WebRTC Sender</title>
</head>
<body>
    <h1>WebRTC Camera Sender (H.264)</h1>
    <video id="localVideo" autoplay muted playsinline></video>
    <br/>
    <button id="startButton">Start Streaming to Rust</button>
    <div id="status">Status: Disconnected</div>
    <div id="codecInfo">Codec: Unknown</div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const startButton = document.getElementById('startButton');
        const statusDiv = document.getElementById('status');
        const codecInfoDiv = document.getElementById('codecInfo');
        let pc;

        async function start() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                localVideo.srcObject = stream;
                
                pc = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });
                
                stream.getTracks().forEach(track => {
                    const sender = pc.addTrack(track, stream);
                    const capabilities = RTCRtpSender.getCapabilities('video');
                    if (capabilities) {
                        const h264Codecs = capabilities.codecs.filter(c => c.mimeType === 'video/H264');
                        if (h264Codecs.length > 0 && sender.setCodecPreferences) {
                            sender.setCodecPreferences(h264Codecs);
                        }
                    }
                });

                pc.oniceconnectionstatechange = () => {
                    statusDiv.innerText = `Status: ${pc.iceConnectionState}`;
                };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                
                // Fetch answer from Rust backend
                const response = await fetch('http://localhost:8080/offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type })
                });

                const answer = await response.json();
                await pc.setRemoteDescription(new RTCSessionDescription(answer));

                // Display negotiated codec
                const senders = pc.getSenders();
                if (senders.length > 0) {
                    const stats = await senders[0].getStats();
                    stats.forEach(report => {
                        if (report.type === 'codec') {
                            codecInfoDiv.innerText = `Codec: ${report.mimeType} / payloadType: ${report.payloadType}`;
                        }
                    });
                }

            } catch (e) {
                console.error(e);
                statusDiv.innerText = `Error: ${e.message}`;
            }
        }

        startButton.onclick = start;
    </script>
</body>
</html>
